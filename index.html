if(t.kind==='payout'){if(t.status==='Received'){m.rec+=a;m.cin+=a}else if(['Requested','Approved','Processing'].includes(t.status))m.pen+=a}
else if(t.type==='Refund'){m.ref+=a;m.cin+=a}else if(t.type==='Subscription / recurring'||t.type==='Other expense'){m.exp+=a;m.cout+=a}else{m.inv+=a;m.cout+=a}}
m.net=m.rec-(m.inv-m.ref)-m.exp;m.cf=m.cin-m.cout;m.roi=m.inv>0?m.net/m.inv*100:null;return m}
const byMonth=L=>{const g={};L.forEach(t=>(g[eff(t).slice(0,7)]??=[]).push(t));return Object.keys(g).sort().map(k=>({k,m:M(g[k])}))};
const dlg=$('#dlg'),open=h=>{dlg.innerHTML=h;dlg.showModal&&!dlg.open&&dlg.showModal()},close=()=>dlg.open&&dlg.close(),toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)},
ask=(m,fn)=>{open(`<h3>Please confirm</h3><p>${m}</p><div class="row"><button class="btn" data-a="close">Cancel</button><button class="btn dn" id="yes">Delete</button></div>`);$('#yes').onclick=()=>{close();fn()}};
const head=(t,a='')=>`<div class="head"><h1>${t}</h1><div class="row">${a}</div></div>`,empty=m=>`<div class="empty">${m}</div>`,card=(l,v,s='',c='')=>`<div class="card"><div class="mu">${l}</div><div class="v ${c}">${v}</div>${s?`<div class="mu s">${s}</div>`:''}</div>`,
chip=s=>`<span class="chip ${s==='Received'||s==='Refund'?'up':['Requested','Approved','Processing'].includes(s)?'pd':['Rejected','Cancelled'].includes(s)?'dn':'mu'}">${s}</span>`,
opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function banner(){let h='';if(S.sample)h+=`<div class="note"><span><b>Sample data</b> is loaded for demonstration only.</span><button class="btn sm" data-a="rmsample">Remove sample data</button></div>`;
const z=[...new Set(S.tx.map(t=>t.cur))].filter(c=>!S.cfg.rates[c]);if(z.length)h+=`<div class="note"><span>No conversion rate set for ${z.join(', ')}. Those transactions count as 0 until you add one in Settings.</span><a class="btn sm" href="#settings">Open settings</a></div>`;return h}
function bar(){const ms=[...new Set(S.tx.map(t=>eff(t).slice(0,7)))].sort().reverse(),cm=F.from&&F.to===F.from.slice(0,7)+'-31'?F.from.slice(0,7):'';
return `<div class="bar"><label>Month<select data-f="month"><option value="">All time</option>${opts(ms,cm)}</select></label><label>From<input type="date" data-f="from" value="${F.from}"></label><label>To<input type="date" data-f="to" value="${F.to}"></label><label>Firm<select data-f="firm"><option value="">All firms</option>${opts(S.firms,F.firm)}</select></label><label>Currency<select data-f="cur"><option value="">All</option>${opts(CUR,F.cur)}</select></label><button class="btn" data-a="reset">Clear filters</button></div>`}
function rowsL(){let L=FL().filter(t=>LQ.kind==='all'||(LQ.kind==='pay')===(t.kind==='payout'));const q=LQ.q.toLowerCase();if(q)L=L.filter(t=>[t.firm,t.acct,t.ref,t.notes,t.desc,t.type].join(' ').toLowerCase().includes(q));if(LQ.st)L=L.filter(t=>t.type===LQ.st||t.status===LQ.st);
return L.sort((a,b)=>LQ.sort==='amount'?(conv(a.amount,a.cur)-conv(b.amount,b.cur))*LQ.dir:(eff(a)<eff(b)?-1:eff(a)>eff(b)?1:0)*LQ.dir)}
function tbl(){const L=rowsL();if(!L.length)return empty('No transactions match. Add one with the buttons above, or clear the filters.');
return `<table><thead><tr><th><a data-a="sort" data-id="date">Date</a></th><th>Firm</th><th>Account</th><th>Type</th><th>Description</th><th class="r"><a data-a="sort" data-id="amount">Amount</a></th><th>Method</th><th>Status</th><th>Docs</th><th></th></tr></thead><tbody>${L.map(t=>`<tr class="xr" tabindex="0" data-a="xt" data-id="${t.id}"><td>${XO.has(t.id)?'▾':'▸'} ${eff(t)}</td><td>${esc(t.firm)}</td><td>${esc(t.acct)}</td><td>${t.type}</td><td>${esc(t.desc||t.notes)}</td><td class="r ${t.kind==='payout'||t.type==='Refund'?'up':''}">${num(t.amount)} ${t.cur}</td><td>${esc(t.method)}</td><td>${chip(t.status)}</td><td>${t.docs.length?'✓ '+t.docs.length:'<span class="mu">None</span>'}</td><td><button class="btn sm" data-a="edit" data-id="${t.id}">Edit</button> <button class="btn sm" data-a="del" data-id="${t.id}">Delete</button></td></tr>${XO.has(t.id)?xdet(t):''}`).join('')}</tbody></table>`}
function ledger(k){LQ.kind=k;const o=k==='pay'?PST:k==='inv'?INV:[...INV,...PST];return `<div class="bar"><input data-q placeholder="Search firm, account, reference or notes" value="${esc(LQ.q)}" aria-label="Search"><select data-st aria-label="Type or status"><option value="">All types and statuses</option>${opts(o,LQ.st)}</select><button class="btn" data-a="exp">Export CSV</button></div><div id="tbl" class="scroll">${tbl()}</div>`}

const FORM=`<details><summary class="mu">How these numbers are calculated</summary><p class="mu">Total investments = new challenges + account purchases + resets + activation fees. Net investment = investments − refunds. Expenses = subscriptions + other expenses.<br>Net profit/loss = confirmed payouts (status Received) − net investment − expenses.<br>Net cash flow = money received (received payouts + refunds, by actual date) − money paid (by purchase date).<br>Monthly ROI = month net profit/loss ÷ month investments × 100, or N/A when investments are zero. Requested, Approved and Processing payouts count only as pending. Rejected and Cancelled count nowhere.</p></details>`;
const PG={

advanced(){return ADV()},

card('Total investments',money(m.inv),'Refunds '+money(m.ref)+' shown separately')+card('Confirmed payouts',money(m.rec),'Status Received only','up')+card('Net cash flow',money(m.cf),'Money in − money out',m.cf<0?'dn':'up')+card('Pending payouts',money(m.pen),'Requested, approved, processing','pd')+card('Total expenses',money(m.exp),'Subscriptions and other')+card('Active challenges',ac.filter(a=>a.status==='Evaluation').length)+card('Funded accounts',ac.filter(a=>a.status==='Funded').length)+card('Monthly ROI',pct(last?last.m.roi:null),last?'Latest month: '+last.k+' · overall '+pct(m.roi):'No data')+card('Accounts purchased',ac.length)+`</div><h2>Transactions</h2>`+ledger('all')+FORM},
investments(){return head('Investments',`<button class="btn p" data-a="new" data-id="inv">Add investment</button>`)+banner()+bar()+ledger('inv')},

firms(){return head('Prop Firms')+`<form id="ff" class="bar"><label>New prop firm<input name="n" required></label><button class="btn p">Add firm</button></form>`+(S.firms.length?`<table><thead><tr><th>Firm</th><th>Accounts</th><th>Invested</th><th>Received</th><th></th></tr></thead><tbody>${S.firms.map(f=>{const L=S.tx.filter(t=>t.firm===f),m=M(L);return `<tr><td>${esc(f)}</td><td>${S.accounts.filter(a=>a.firm===f).length}</td><td>${money(m.inv)}</td><td>${money(m.rec)}</td><td><button class="btn sm" data-a="dfirm" data-id="${esc(f)}">Delete</button></td></tr>`}).join('')}</tbody></table>`:empty('No prop firms yet. Add your first one above.'))},
accounts(){return head('Accounts')+(S.accounts.length?`<div class="scroll"><table><thead><tr><th>Firm</th><th>Account</th><th>Challenge</th><th class="r">Size</th><th>Purchased</th><th>Status</th><th class="r">Invested</th><th class="r">Received</th><th class="r">Pending</th><th class="r">Net P/L</th><th>Docs</th></tr></thead><tbody>${S.accounts.map(a=>{const L=S.tx.filter(t=>t.firm===a.firm&&t.acct===a.name),m=M(L);return `<tr><td>${esc(a.firm)}</td><td>${esc(a.name)}</td><td>${esc(a.ctype)}</td><td class="r">${a.size?num(a.size):''}</td><td>${a.date}</td><td><select data-ast="${a.id}" aria-label="Status">${opts(AST,a.status)}</select></td><td class="r">${money(m.inv+m.exp-m.ref)}</td><td class="r">${money(m.rec)}</td><td class="r">${money(m.pen)}</td><td class="r ${m.net<0?'dn':'up'}">${money(m.net)}</td><td>${L.reduce((n,t)=>n+t.docs.length,0)}</td></tr>`}).join('')}</tbody></table></div>`:empty('No accounts yet. Accounts are created when you save an investment or payout with an account name.'))},
documents(){return head('Documents')+`<div class="bar"><input data-dq placeholder="Search by firm, account, file name, reference or date" value="${esc(DQ.q)}" aria-label="Search"><select data-dcat aria-label="Category"><option value="">All categories</option>${opts(CAT,DQ.cat)}</select></div><div id="dtbl" class="scroll">${dtbl()}</div>`},
analytics(){const L=FL(),mo=byMonth(L),yr=today().slice(0,4),y=M(L.filter(t=>eff(t).startsWith(yr))),fm={};L.forEach(t=>(fm[t.firm]??=[]).push(t));

settings(){return head('Settings')+banner()+`<h2>Reporting currency and rates</h2><div class="grid2"><label>Reporting currency<select data-cfg="cur">${opts(CUR,S.cfg.cur)}</select></label></div><p class="mu">Rates are the value of one unit in USD. Edit them to match the rate you want to report with.</p><div class="cards">${CUR.map(c=>`<label>${c} in USD<input type="number" step="any" min="0" value="${S.cfg.rates[c]}" data-rate="${c}"></label>`).join('')}</div><h2>Your data</h2><div class="row" style="justify-content:flex-start"><button class="btn" data-a="expjson">Export all data</button><button class="btn dn" data-a="wipe">Delete all data</button></div><p class="mu">Everything is stored privately in this browser. Documents stay on this device.</p>`}};
function dtbl(){const q=DQ.q.toLowerCase();const D=allDocs().filter(d=>(!DQ.cat||d.cat===DQ.cat)&&(!q||[d.name,d.t.firm,d.t.acct,d.t.ref,d.t.date,d.cat].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.t.firm.localeCompare(b.t.firm)||(eff(b.t)<eff(a.t)?-1:1));

const acctOf=t=>S.accounts.find(a=>a.firm===t.firm&&a.name===t.acct);
function form(kind,t){t=t||{};const pay=kind==='pay',f=(l,n,v='',ty='text',x='')=>`<label>${l}<input name="${n}" type="${ty}" value="${esc(v)}" ${x}></label>`,sel=(l,n,o,v)=>`<label>${l}<select name="${n}">${opts(o,v)}</select></label>`,m=t.id?'data-m="1"':'';

(pay?f('Payout request date','date',t.date||today(),'date','required')+f('Approval date','appr',t.appr,'date')+f('Actual received date','cash',t.cash,'date')+f('Payout amount','amount',t.amount,'number','step="any" min="0" required')+sel('Currency','cur',CUR,t.cur||S.cfg.cur)+sel('Payout status','status',PST,t.status||'Requested')
:sel('Type','type',INV,t.type||INV[0])+f('Challenge type and phase','desc',t.desc)+f('Account size','size',t.size||'','number','step="any"')+f('Purchase date','date',t.date||today(),'date','required')+f('Purchase price','price',t.price||'','number','step="any"')+f('Discount or coupon','disc',t.disc||'','number','step="any"')+f('Final amount paid','amount',t.amount,'number','step="any" min="0" required '+m)+sel('Currency','cur',CUR,t.cur||S.cfg.cur)+sel('Account status','astatus',AST,acctOf(t)?.status||'Evaluation'))+
f('Payment method','method',t.method)+f('Transaction reference','ref',t.ref)+`</div><label>Notes<textarea name="notes" rows="2">${esc(t.notes)}</textarea></label><div class="grid2"><label>Attach documents (PDF, images, Office files, up to 10 MB each)<input type="file" name="files" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt"></label>${sel('Document category','cat',CAT,pay?'Payout Certificate':'Payment Receipt')}</div>${t.docs?.length?`<p class="mu">${t.docs.length} document(s) attached. Manage them under Documents.</p>`:''}${t.hist?.length?`<p class="mu">Status history: ${t.hist.map(h=>h.s+' ('+h.at+')').join(' → ')}</p>`:''}<p id="err" class="dn" role="alert"></p><div class="row"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn p">Save</button></div></form>`}

  const m=String(error?.message||'Authentication failed.');
  if(/invalid login credentials/i.test(m)) return 'Email or password is incorrect.';
  if(/email not confirmed/i.test(m)) return 'Please confirm your email using the link we sent you, then log in.';
  if(/user already registered/i.test(m)) return 'An account with this email already exists. Log in instead.';
  if(/password should be at least/i.test(m)) return 'Use a longer password (at least 8 characters).';
  return m;
}
function LOGIN(){
  const up=LM==='up';
  if(!sbClient) return `<div class="auth"><div class="pn"><h2>Authentication could not load</h2><p class="mu">The Supabase JavaScript library did not load. Check your internet connection and reload the page.</p></div></div>`;
  if(!authReady) return `<div class="auth"><div class="pn"><h2>Account</h2><p class="mu">Checking your sign-in session…</p></div></div>`;
  if(authUser){
    const p=currentProfile(),initial=(p.name||'?')[0].toUpperCase();
    return head('Account')+`<div class="auth"><div class="pn"><div class="av">${esc(initial)}</div><h2 style="margin-top:0">${esc(p.name)}</h2><p class="mu">${esc(p.email)}</p><p class="mu s">Signed in with Supabase Auth. Your account can be used on other devices; this does not yet sync this app's ledger or documents.</p><p id="aerr" class="dn" role="alert"></p><button class="btn p" data-a="signout" ${authBusy?'disabled':''}>${authBusy?'Signing out…':'Sign out'}</button></div></div>`;
  }
  const G='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.4a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>';
  return `<div class="auth"><div class="pn"><div class="atabs"><button class="btn ${up?'':'p'}" data-a="lmode" data-id="in" type="button">Log in</button><button class="btn ${up?'p':''}" data-a="lmode" data-id="up" type="button">Sign up</button></div><button class="btn gbtn" data-a="google" type="button" style="width:100%">${G} Continue with Google</button><div class="or">or use email</div><form id="af" data-mode="${LM}">${up?`<label>Name<input name="name" autocomplete="name" required maxlength="100"></label>`:''}<label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="pw" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="8" required></label>${up?`<label>Confirm password<input name="pw2" type="password" autocomplete="new-password" minlength="8" required></label>`:''}<p id="aerr" class="dn" role="alert"></p><button class="btn p" style="width:100%" ${authBusy?'disabled':''}>${authBusy?'Please wait…':(up?'Create account':'Log in')}</button></form><p class="mu s" style="margin-top:12px">Secure email/password authentication is handled by Supabase. If email confirmation is enabled, confirm your email before logging in.</p></div></div>`;
}
document.addEventListener('submit',async e=>{
  const fm=e.target;if(fm.id!=='af')return;
  e.preventDefault();
  if(!sbClient||authBusy)return;
  const v=fm.elements,err=m=>{const el=$('#aerr');if(el){el.textContent=m;el.classList.remove('dn')}};
  const email=v.email.value.trim().toLowerCase(),password=v.pw.value,up=fm.dataset.mode==='up';
  if(up&&password!==v.pw2.value)return err('Passwords do not match.');
  if(up&&password.length<8)return err('Use at least 8 characters for the password.');
  authBusy=true;const btn=fm.querySelector('button[type="submit"],button:not([type])');if(btn){btn.disabled=true;btn.textContent=up?'Creating account…':'Logging in…'}
  try{
    if(up){
      const name=v.name.value.trim();
      const {data,error}=await sbClient.auth.signUp({email,password,options:{data:{full_name:name,name}}});
      if(error)throw error;
      if(data.session){
        toast('Account created');
      }else{
        const el=$('#aerr');if(el){el.textContent='Account created. Check your email for a confirmation link, then log in.';el.classList.remove('dn')}
        authBusy=false;btn.disabled=false;btn.textContent='Create account';return;
      }
    }else{
      const {error}=await sbClient.auth.signInWithPassword({email,password});
      if(error)throw error;
      toast('Welcome back');
    }
  }catch(error){err(authErrorMessage(error))}
  finally{authBusy=false;if($('#main'))render()}
});
act.lmode=m=>{LM=m;render()};
act.signout=async()=>{
  if(!sbClient||authBusy)return;
  authBusy=true;render();
  const {error}=await sbClient.auth.signOut();
  authBusy=false;
  if(error){toast(authErrorMessage(error));render();return}
  toast('Signed out');render();
};
act.google=async()=>{
  if(!sbClient)return;
  const {error}=await sbClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname+'#login'}});
  if(error)open(`<h3>Google sign-in could not start</h3><p class="mu">${esc(authErrorMessage(error))}</p><div class="row"><button class="btn p" data-a="close">Close</button></div>`);
};
sbClient?.auth.onAuthStateChange((_event,session)=>{
  authUser=session?.user||null;authReady=true;
  if($('#main'))render();
});
if(sbClient){
  sbClient.auth.getSession().then(({data,error})=>{
    if(error)console.warn('Supabase session check:',error.message);
    authUser=data?.session?.user||null;authReady=true;render();
  }).catch(()=>{authReady=true;render()});
}
